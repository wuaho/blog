#  mapping: pathname
#  reactions-enabled: 1
#  emit-metadata: 0
#  theme: light

################
# --- Misc --- #
################

date_format: "%d/%m/%Y"

#################################################################################
# --- Build options --- #
#################################################################################

theme: beautiful-jekyll-theme

timezone: "Europe/Madrid"
markdown: kramdown
highlighter: rouge
# Same URLs as the old Hashnode blog: /<slug>/
permalink: /:title/
paginate: 5
paginate_path: "/page:num/"

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
      readtime: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .bundle/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
